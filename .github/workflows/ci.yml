name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["28.2", "29.4", "30.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Byte-compile
        run: emacs -Q --batch -L . --eval "(setq byte-compile-error-on-warn t)" -f batch-byte-compile ivory-themes.el ivory-light-theme.el ivory-dark-theme.el ivory-themes-tests.el && rm -f *.elc
      - name: Run tests
        run: emacs -Q --batch -L . -l ert -l ivory-themes-tests.el -f ert-run-tests-batch-and-exit
