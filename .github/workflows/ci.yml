name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["28.2", "29.4", "30.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Byte-compile
        run: emacs -Q --batch -L . --eval "(setq byte-compile-error-on-warn t)" -f batch-byte-compile ivory-themes.el ivory-light-theme.el ivory-dark-theme.el ivory-themes-tests.el && rm -f *.elc
      - name: Run tests
        run: emacs -Q --batch -L . -l ert -l ivory-themes-tests.el -f ert-run-tests-batch-and-exit
      - name: Package lint
        if: matrix.emacs-version == '30.2'
        run: |
          emacs -Q --batch \
            --eval "(progn (require 'package) (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\")) (package-initialize) (package-refresh-contents) (package-install 'package-lint) (require 'package-lint))" \
            -f package-lint-batch-and-exit ivory-themes.el
